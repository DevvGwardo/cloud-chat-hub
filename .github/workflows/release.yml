name: Release

# Triggers a build whenever a version tag is pushed.
# Use prerelease tags for beta builds: v1.0.0-beta.1, v1.0.0-beta.2, ...
#
# Windows-only distribution: no Apple Developer license is held, so macOS
# builds (which require signing + notarization to be usable) are not produced.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0-beta.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Must match CI (Node 22). better-sqlite3 12.10+ ships win32
          # prebuilds for ABI 127+ (Node 22+), not Node 20 — a Node 20
          # install falls through to node-gyp and fails on windows-latest
          # (no usable VS toolchain for native rebuild).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Download python-build-standalone for the runner so the bundled app
      # ships a self-contained Python interpreter (x86_64 Windows target).
      # Pinned to a known release of indygreg/python-build-standalone.
      - name: Download bundled Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PY_TARGET: x86_64-pc-windows-msvc
        run: |
          $PyVersion = "3.12.7"
          $BuildDate = "20241016"
          $Tarball = "cpython-${PyVersion}+${BuildDate}-${env:PY_TARGET}-install_only.tar.gz"
          $Url = "https://github.com/indygreg/python-build-standalone/releases/download/${BuildDate}/${Tarball}"
          New-Item -ItemType Directory -Force -Path resources\python-runtime | Out-Null
          Invoke-WebRequest -Uri $Url -OutFile $env:TEMP\python.tar.gz
          tar -xzf $env:TEMP\python.tar.gz -C $env:TEMP
          # Tarball extracts to %TEMP%\python\ — copy contents up.
          Copy-Item -Path "$env:TEMP\python\*" -Destination "resources\python-runtime\" -Recurse -Force
          Get-ChildItem resources\python-runtime

      # Expose Windows Authenticode signing to electron-builder only when a cert
      # secret is present. Writing CSC_LINK as an empty string makes
      # electron-builder treat it as a cert *path* and fail ("not a file"), so
      # we leave it unset rather than blank when no cert is configured — an
      # unset cert just builds unsigned.
      - name: Configure Windows code signing
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Only export CSC_LINK when a cert is actually configured. Writing an
          # empty value would make electron-builder treat '' as a cert path and
          # fail, so an unset cert just builds unsigned.
          if [ -n "$WIN_CSC_LINK" ]; then
            {
              echo "CSC_LINK=$WIN_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No Windows signing cert configured; building unsigned."
          fi

      - name: Build & publish
        env:
          # GH_TOKEN: provided automatically by Actions, used by electron-builder
          # at PUBLISH time to upload artifacts to the release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CLOUDCHAT_UPDATE_TOKEN: fine-grained PAT (contents: read) baked into
          # the built app so end users can fetch updates from this private repo.
          # See docs/BETA-TESTING.md for setup. If unset, auto-update is disabled
          # in shipped builds — they still install fine, just won't self-update.
          CLOUDCHAT_UPDATE_TOKEN: ${{ secrets.CLOUDCHAT_UPDATE_TOKEN }}
          # Mark prereleases automatically when tag contains a hyphen (e.g. -beta.1)
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-') }}
        run: npm run electron:publish:win
