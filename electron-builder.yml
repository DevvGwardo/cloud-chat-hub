appId: app.spark.desktop
productName: Spark
directories:
  buildResources: build
  output: release
# Signs the bundled python-runtime binaries before electron-builder's main
# signing pass. See build/afterPack.cjs for the rationale.
afterPack: build/afterPack.cjs
files:
  - "out/**"
  - "server/**"
  - "package.json"
  # node_modules is deliberately NOT listed here: electron-builder automatically
  # includes the production dependency tree (dependencies in package.json), which
  # is what out/main/index.js actually requires at runtime. Shipping
  # "node_modules/**" wholesale dragged in the entire 1.3GB dev tree (electron,
  # vite, vitest, playwright, electron-builder, …). The renderer is fully
  # bundled into out/renderer, so it needs no node_modules at runtime.
  # Dev-only stragglers that live in `dependencies` are excluded explicitly:
  - "!node_modules/typescript/**"
  - "!node_modules/tsup/**"
  - "!node_modules/@types/**"
  - "!node_modules/@testing-library/**"
  - "!**/.git"
  - "!**/node_modules/.cache"
  - "!docs/**"
  - "!src/**"
  - "!electron/**"
  - "!**/*.map"
  - "!**/*.test.*"
  - "!**/__tests__/**"
extraResources:
  # Bridge source — spawned by electron/bridge.ts at runtime.
  # CI also writes a python-runtime/ directory here per platform; on dev
  # machines that directory is absent and bridge.ts falls back to system Python.
  - from: "hermes-bridge"
    to: "hermes-bridge"
    filter:
      - "**/*.py"
      - "requirements.txt"
      - "data/**"
      - "!__pycache__/**"
      - "!venv/**"
      - "!.venv/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!test_*.py"
      - "!*_test.py"
      - "!update.log"
  - from: "resources/python-runtime"
    to: "python-runtime"
  # Runtime icons (tray + window). The build/ dir is a build resource and is NOT
  # shipped inside the app bundle; electron/index.ts resolves these from
  # process.resourcesPath/icons.
  - from: "build/spark-icon.png"
    to: "icons/spark-icon.png"
  - from: "build/spark-tray-iconTemplate.png"
    to: "icons/spark-tray-iconTemplate.png"
  # Hermes agent patches — applied programmatically by electron/bridge.ts after
  # cloning the pinned hermes-agent release.
  - from: "patches"
    to: "patches"
    filter:
      - "*.patch"
mac:
  icon: build/spark-icon.icns
  # Architecture is chosen per release job via the electron-builder CLI flag
  # (--arm64 / --x64 in release.yml); both build on the arm64 runner, with x64
  # cross-compiled. Each job bundles a standalone Python runtime matching its
  # target arch. Omitting `arch` here lets the CLI flag decide.
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  # NSIS requires a proper .ico — generated from build/spark-icon.png via
  # `magick build/spark-icon.png -define icon:auto-resize=256,128,64,48,32,16 build/spark-icon.ico`
  icon: build/spark-icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Spark-${version}-win.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Spark
dmg:
  # ${arch} keeps the arm64 and x64 DMGs from overwriting each other when both
  # macOS jobs publish to the same release.
  artifactName: "Spark-${version}-${arch}-mac.${ext}"
linux:
  icon: build/spark-icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: "Spark-${version}-linux-${arch}.${ext}"
publish:
  provider: github
  owner: DevvGwardo
  repo: spark
  private: true
npmRebuild: false
asar: true
asarUnpack:
  - "server/**"
  - "node_modules/express/**"
  - "node_modules/cors/**"
  # Renderer is served over HTTP for remote access (QR / tunnel); express.static
  # needs it on a real filesystem path, not inside the asar archive.
  - "out/renderer/**"
